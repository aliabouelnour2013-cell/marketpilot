# Local PostgreSQL for MarketPilot development.
#
# Usage:
#   docker compose up -d
#   # then in .env.local:
#   DATABASE_URL=postgresql://marketpilot:marketpilot@localhost:5432/marketpilot
#   npx prisma migrate dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketpilot
      POSTGRES_PASSWORD: marketpilot
      POSTGRES_DB: marketpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
